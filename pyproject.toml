[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slm-harness"
version = "1.0.0"
description = "Co-designing a fine-tuned small language model and a task-specific harness for cost-efficient multi-agent subagents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ishaan Ranjan" },
    { name = "Ganesh Talluri" },
]

dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["slm_harness", "openharness"]

[tool.pytest.ini_options]
testpaths = ["slm_harness/tests"]
asyncio_mode = "auto"
